server {
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Keep SW/manifest fresh; force correct PWA MIME (not octet-stream)
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Django API / schema / docs
    location /api/ {
        proxy_pass http://buildinghub-web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://buildinghub-web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static (admin, spectacular, etc.)
    location /static/ {
        proxy_pass http://buildinghub-web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Uploaded media from shared volume (protected API routes still apply for app flows)
    location /media/ {
        alias /media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
